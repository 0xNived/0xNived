<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">Nived developer profile</title>
  <desc id="desc">A neofetch-inspired terminal card with an ASCII robot and developer profile details.</desc>
  <rect width="1100" height="510" rx="18" fill="#0d1117"/>
  <rect x="34" y="30" width="1032" height="450" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="62" cy="58" r="7" fill="#ff7b72"/>
  <circle cx="86" cy="58" r="7" fill="#d29922"/>
  <circle cx="110" cy="58" r="7" fill="#3fb950"/>
  <text x="140" y="64" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">nived@workstation</text>
  <line x1="58" y1="86" x2="1042" y2="86" stroke="#30363d"/>


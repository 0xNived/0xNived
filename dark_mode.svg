<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Nived Ubuntu developer terminal</title>
  <desc id="desc">A Fastfetch-inspired Ubuntu terminal with detailed ASCII art and Nived's developer profile.</desc>

  <rect width="1200" height="610" rx="18" fill="#0d1117"/>
  <rect x="30" y="25" width="1140" height="560" rx="14" fill="#161b22" stroke="#30363d"/>

  <circle cx="58" cy="54" r="7" fill="#ff7b72"/>
  <circle cx="82" cy="54" r="7" fill="#d29922"/>
  <circle cx="106" cy="54" r="7" fill="#3fb950"/>
  <text x="136" y="60" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">nived@desktop: ~</text>
  <line x1="54" y1="80" x2="1146" y2="80" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="68" y="108" fill="#3fb950">nived@desktop</text>
    <text x="190" y="108" fill="#8b949e">:</text>
    <text x="202" y="108" fill="#58a6ff">~</text>
    <text x="214" y="108" fill="#c9d1d9">$ fastfetch --logo ubuntu</text>
  </g>

  <text xml:space="preserve" fill="#e95420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" font-weight="700">
    <tspan x="58" y="142">                             ....</tspan>
    <tspan x="58" dy="18">              .',:clooo:  .:looooo:.</tspan>
    <tspan x="58" dy="18">           .;looooooooc  .oooooooooo'</tspan>
    <tspan x="58" dy="18">        .;looooool:,''.  :ooooooooooc</tspan>
    <tspan x="58" dy="18">       ;looool;.         'oooooooooo,</tspan>
    <tspan x="58" dy="18">      ;clool'             .cooooooc.  ,,</tspan>
    <tspan x="58" dy="18">         ...                ......  .:oo,</tspan>
    <tspan x="58" dy="18">  .;clol:,.                        .loooo'</tspan>
    <tspan x="58" dy="18"> :ooooooooo,                        'ooool</tspan>
    <tspan x="58" dy="18">'ooooooooooo.                        loooo.</tspan>
    <tspan x="58" dy="18">'ooooooooool                         coooo.</tspan>
    <tspan x="58" dy="18"> ,loooooooc.                        .loooo.</tspan>
    <tspan x="58" dy="18">   .,;;;'.                          ;ooooc</tspan>
    <tspan x="58" dy="18">       ...                         ,ooool.</tspan>
    <tspan x="58" dy="18">    .cooooc.              ..',,'.  .cooo.</tspan>
    <tspan x="58" dy="18">      ;ooooo:.           ;oooooooc.  :l.</tspan>
    <tspan x="58" dy="18">       .coooooc,..      coooooooooo.</tspan>
    <tspan x="58" dy="18">         .:ooooooolc:. .ooooooooooo'</tspan>
    <tspan x="58" dy="18">           .':loooooo;  ,oooooooooc</tspan>
    <tspan x="58" dy="18">               ..';::c'  .;loooo:'</tspan>
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="566" y="146" fill="#f0f6fc" font-size="22" font-weight="700">nived@desktop</text>
    <text x="566" y="170" fill="#8b949e" font-size="15">──────────────────────────────────────────</text>


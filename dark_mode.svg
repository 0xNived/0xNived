    <text x="718" y="208" fill="#c9d1d9" font-size="16">Ubuntu Linux</text>
    <text x="566" y="238" fill="#e95420" font-size="16" font-weight="700">DE</text>
    <text x="718" y="238" fill="#c9d1d9" font-size="16">GNOME</text>
    <text x="566" y="268" fill="#e95420" font-size="16" font-weight="700">Kernel</text>
    <text x="718" y="268" fill="#c9d1d9" font-size="16">Linux x86_64</text>
    <text x="566" y="298" fill="#e95420" font-size="16" font-weight="700">Shell</text>
    <text x="718" y="298" fill="#c9d1d9" font-size="16">bash</text>
    <text x="566" y="328" fill="#e95420" font-size="16" font-weight="700">Terminal</text>

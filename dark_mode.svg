    <text x="566" y="432" fill="#e95420" font-size="16" font-weight="700">Focus</text>
    <text x="718" y="432" fill="#c9d1d9" font-size="16">systems · automation · practical AI</text>
    <text x="566" y="462" fill="#e95420" font-size="16" font-weight="700">Building</text>
    <text x="718" y="462" fill="#c9d1d9" font-size="16">Neo · Onion Bot · ForgeInHouse</text>

    <rect x="566" y="492" width="24" height="14" rx="2" fill="#2e3436"/>
    <rect x="596" y="492" width="24" height="14" rx="2" fill="#cc0000"/>
    <rect x="626" y="492" width="24" height="14" rx="2" fill="#4e9a06"/>
    <rect x="656" y="492" width="24" height="14" rx="2" fill="#c4a000"/>

    <rect x="776" y="492" width="24" height="14" rx="2" fill="#d3d7cf"/>

    <text x="68" y="548" fill="#3fb950" font-size="15">nived@desktop</text>
    <text x="190" y="548" fill="#8b949e" font-size="15">:</text>

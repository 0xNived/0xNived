    <tspan x="58" dy="18">           .':loooooo;  ,oooooooooc</tspan>
    <tspan x="58" dy="18">               ..';::c'  .;loooo:'</tspan>
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

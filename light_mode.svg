<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Nived Ubuntu developer terminal</title>
  <desc id="desc">A Fastfetch-inspired Ubuntu terminal with detailed ASCII art and Nived's developer profile.</desc>

  <rect width="1200" height="610" rx="18" fill="#f6f8fa"/>
  <rect x="30" y="25" width="1140" height="560" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <circle cx="58" cy="54" r="7" fill="#cf222e"/>
  <circle cx="82" cy="54" r="7" fill="#bf8700"/>
  <circle cx="106" cy="54" r="7" fill="#1a7f37"/>
  <text x="136" y="60" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">nived@desktop: ~</text>
  <line x1="54" y1="80" x2="1146" y2="80" stroke="#d0d7de"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="68" y="108" fill="#1a7f37">nived@desktop</text>
    <text x="190" y="108" fill="#57606a">:</text>
    <text x="202" y="108" fill="#0969da">~</text>
    <text x="214" y="108" fill="#24292f">$ fastfetch --logo ubuntu</text>
  </g>


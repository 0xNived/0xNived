    <tspan x="58" dy="18">      ;clool'             .cooooooc.  ,,</tspan>
    <tspan x="58" dy="18">         ...                ......  .:oo,</tspan>
    <tspan x="58" dy="18">  .;clol:,.                        .loooo'</tspan>
    <tspan x="58" dy="18"> :ooooooooo,                        'ooool</tspan>
    <tspan x="58" dy="18">'ooooooooooo.                        loooo.</tspan>
    <tspan x="58" dy="18">'ooooooooool                         coooo.</tspan>
    <tspan x="58" dy="18"> ,loooooooc.                        .loooo.</tspan>
    <tspan x="58" dy="18">   .,;;;'.                          ;ooooc</tspan>
    <tspan x="58" dy="18">       ...                         ,ooool.</tspan>
    <tspan x="58" dy="18">    .cooooc.              ..',,'.  .cooo.</tspan>
    <tspan x="58" dy="18">      ;ooooo:.           ;oooooooc.  :l.</tspan>

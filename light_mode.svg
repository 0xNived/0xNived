  <rect x="34" y="30" width="1032" height="450" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="62" cy="58" r="7" fill="#cf222e"/>
  <circle cx="86" cy="58" r="7" fill="#bf8700"/>
  <circle cx="110" cy="58" r="7" fill="#1a7f37"/>

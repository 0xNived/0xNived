<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Nived Ubuntu terminal profile</title>
  <desc id="desc">A clean GNOME Terminal window showing Ubuntu Fastfetch-style ASCII art and developer information.</desc>


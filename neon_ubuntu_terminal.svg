<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Nived neon Ubuntu terminal profile</title>
  <desc id="desc">A neon phosphor terminal poster with detailed Ubuntu ASCII art and Nived's developer profile.</desc>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071007"/>
      <stop offset="0.52" stop-color="#0a120b"/>
      <stop offset="1" stop-color="#050906"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0.58" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#c7ff4a" opacity="0.035"/>
    </pattern>
    <filter id="phosphor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.25  0 1 0 0 0.35  0 0 1 0 0.05  0 0 0 0.8 0" result="greenGlow"/>
      <feMerge>
        <feMergeNode in="greenGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="24" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 0.10"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="18" fill="#030604"/>
  <rect x="22" y="22" width="1156" height="636" rx="14" fill="url(#screen)" stroke="#9dff36" stroke-opacity="0.34"/>
  <rect x="22" y="22" width="1156" height="636" rx="14" fill="url(#scanlines)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="60" fill="#c7ff4a" font-size="14" letter-spacing="1.8" filter="url(#softGlow)">BUILD USEFUL SYSTEMS.</text>
    <text x="1148" y="60" fill="#78f7df" font-size="14" text-anchor="end" letter-spacing="1.4">NIVED // UBUNTU</text>
    <line x1="52" y1="78" x2="1148" y2="78" stroke="#9dff36" stroke-opacity="0.58"/>

    <text x="52" y="108" fill="#73e6d2" font-size="14">nived@desktop</text>
    <text x="170" y="108" fill="#6c8b70" font-size="14">:</text>
    <text x="181" y="108" fill="#c7ff4a" font-size="14">~</text>
    <text x="194" y="108" fill="#d7f9ba" font-size="14">$ fastfetch --logo ubuntu</text>

    <rect x="48" y="128" width="490" height="408" rx="8" fill="#071008" fill-opacity="0.55" stroke="#9dff36" stroke-opacity="0.25"/>
    <rect x="562" y="128" width="590" height="408" rx="8" fill="#071008" fill-opacity="0.55" stroke="#9dff36" stroke-opacity="0.25"/>
  </g>

  <text xml:space="preserve" fill="#c7ff4a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" font-weight="700" filter="url(#phosphor)">
    <tspan x="64" y="164">                             ....</tspan>
    <tspan x="64" dy="18">              .',:clooo:  .:looooo:.</tspan>
    <tspan x="64" dy="18">           .;looooooooc  .oooooooooo'</tspan>
    <tspan x="64" dy="18">        .;looooool:,''.  :ooooooooooc</tspan>
    <tspan x="64" dy="18">       ;looool;.         'oooooooooo,</tspan>
    <tspan x="64" dy="18">      ;clool'             .cooooooc.  ,,</tspan>
    <tspan x="64" dy="18">         ...                ......  .:oo,</tspan>
    <tspan x="64" dy="18">  .;clol:,.                        .loooo'</tspan>
    <tspan x="64" dy="18"> :ooooooooo,                        'ooool</tspan>
    <tspan x="64" dy="18">'ooooooooooo.                        loooo.</tspan>
    <tspan x="64" dy="18">'ooooooooool                         coooo.</tspan>
    <tspan x="64" dy="18"> ,loooooooc.                        .loooo.</tspan>
    <tspan x="64" dy="18">   .,;;;'.                          ;ooooc</tspan>
    <tspan x="64" dy="18">       ...                         ,ooool.</tspan>
    <tspan x="64" dy="18">    .cooooc.              ..',,'.  .cooo.</tspan>
    <tspan x="64" dy="18">      ;ooooo:.           ;oooooooc.  :l.</tspan>
    <tspan x="64" dy="18">       .coooooc,..      coooooooooo.</tspan>
    <tspan x="64" dy="18">         .:ooooooolc:. .ooooooooooo'</tspan>
    <tspan x="64" dy="18">           .':loooooo;  ,oooooooooc</tspan>
    <tspan x="64" dy="18">               ..';::c'  .;loooo:'</tspan>
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="596" y="171" fill="#e8ffd2" font-size="23" font-weight="700" filter="url(#softGlow)">nived@desktop</text>
    <text x="596" y="196" fill="#78f7df" font-size="14">────────────────────────────────────────────</text>

    <text x="596" y="232" fill="#c7ff4a" font-size="15" font-weight="700">OS</text>
    <text x="750" y="232" fill="#d7f9ba" font-size="15">Ubuntu Linux</text>
    <text x="596" y="260" fill="#c7ff4a" font-size="15" font-weight="700">DE</text>
    <text x="750" y="260" fill="#d7f9ba" font-size="15">GNOME</text>
    <text x="596" y="288" fill="#c7ff4a" font-size="15" font-weight="700">Kernel</text>
    <text x="750" y="288" fill="#d7f9ba" font-size="15">Linux x86_64</text>
    <text x="596" y="316" fill="#c7ff4a" font-size="15" font-weight="700">Shell</text>
    <text x="750" y="316" fill="#d7f9ba" font-size="15">bash</text>
    <text x="596" y="344" fill="#c7ff4a" font-size="15" font-weight="700">Terminal</text>
    <text x="750" y="344" fill="#d7f9ba" font-size="15">GNOME Terminal</text>

    <text x="596" y="380" fill="#78f7df" font-size="14">────────────────────────────────────────────</text>
    <text x="596" y="416" fill="#c7ff4a" font-size="15" font-weight="700">Languages</text>
    <text x="750" y="416" fill="#d7f9ba" font-size="15">JavaScript · TypeScript · Go · Python</text>
    <text x="596" y="444" fill="#c7ff4a" font-size="15" font-weight="700">Focus</text>
    <text x="750" y="444" fill="#d7f9ba" font-size="15">systems · automation · practical AI</text>
    <text x="596" y="472" fill="#c7ff4a" font-size="15" font-weight="700">Building</text>
    <text x="750" y="472" fill="#d7f9ba" font-size="15">Neo · Onion Bot · ForgeInHouse</text>

    <rect x="596" y="500" width="24" height="11" rx="1" fill="#151b16"/>
    <rect x="626" y="500" width="24" height="11" rx="1" fill="#ff4268"/>
    <rect x="656" y="500" width="24" height="11" rx="1" fill="#a8ff3e"/>
    <rect x="686" y="500" width="24" height="11" rx="1" fill="#ffe14a"/>
    <rect x="716" y="500" width="24" height="11" rx="1" fill="#48a6ff"/>
    <rect x="746" y="500" width="24" height="11" rx="1" fill="#c67cff"/>
    <rect x="776" y="500" width="24" height="11" rx="1" fill="#52f5dc"/>
    <rect x="806" y="500" width="24" height="11" rx="1" fill="#e8ffd2"/>

    <rect x="48" y="558" width="1104" height="64" rx="7" fill="#0a160b" stroke="#9dff36" stroke-opacity="0.38"/>
    <text x="72" y="584" fill="#c7ff4a" font-size="15" font-weight="700" filter="url(#softGlow)">&gt; BUILD SMALL. VERIFY THE HARD PARTS. SHIP WHAT WORKS.</text>
    <text x="72" y="606" fill="#78f7df" font-size="13" letter-spacing="1.2">SYSTEM DESIGN // AUTOMATION // PRACTICAL AI // ALWAYS ITERATING</text>

    <text x="52" y="646" fill="#6f9b6d" font-size="11" letter-spacing="1.5">LOCAL-FIRST SIGNAL // PROFILE ONLINE</text>
    <text x="1148" y="646" fill="#6f9b6d" font-size="11" text-anchor="end" letter-spacing="1.5">SYS.PROFILE_2026</text>
  </g>

  <rect x="22" y="22" width="1156" height="636" rx="14" fill="url(#vignette)"/>
  <rect x="22" y="22" width="1156" height="636" rx="14" filter="url(#grain)" opacity="0.42"/>
</svg>
